<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1222">
<title>MITOSIS: PROPHASE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Inter:wght@300;400&family=Space+Grotesk:wght@300;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1222; --gold:#D8C5A5; --white:#F4F8FC; --cyan:#7FE3F0; --muted:#A9B8CC; --eyebrow:#8FB4C8;
  --f-script:"Allura","Great Vibes","Snell Roundhand","Apple Chancery","Brush Script MT",cursive;
  --f-head:"Space Grotesk","Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy);overflow:hidden}
body{color:var(--white);font-family:var(--f-body);-webkit-font-smoothing:antialiased}

.intro{position:fixed;inset:0;background:var(--navy);overflow:hidden;display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(10,18,34,0) 35%,rgba(10,18,34,.55) 80%,rgba(10,18,34,.9) 100%)}

/* Signature */
.sig{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.7rem;text-align:center;padding:0 1.5rem;
  opacity:0;transition:opacity 1.2s var(--ease)}
.sig.in{opacity:1}
.sig.out{opacity:0;transition-duration:1s}
.sig-name{font-family:var(--f-script);font-size:clamp(1.7rem,6vw,2.3rem);color:var(--gold);letter-spacing:.02em;line-height:1.2;
  text-shadow:0 0 18px rgba(216,197,165,.18)}
.sig-line{display:block;height:1px;width:min(9rem,38vw);transform:scaleX(0);
  background:linear-gradient(90deg,transparent,var(--gold),transparent);transition:transform 1.4s var(--ease)}
.sig.in .sig-line{transform:scaleX(1);transition-delay:.5s}

/* Title */
.title{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 1.25rem;max-width:100%}
.title>*{opacity:0;transform:translateY(10px) scale(.985);transition:opacity 1.3s var(--ease),transform 1.8s var(--ease)}
.title>.show{opacity:1;transform:none}
.eyebrow{font:400 clamp(.62rem,2.4vw,.8rem)/1.4 var(--f-body);letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--eyebrow);margin-bottom:clamp(.9rem,3vh,1.6rem)}
h1{display:flex;flex-direction:column;align-items:center;font-family:var(--f-head);font-weight:500;opacity:1!important;transform:none!important}
h1 span{opacity:0;transform:translateY(12px) scale(.98);transition:opacity 1.4s var(--ease),transform 1.9s var(--ease)}
h1 span.show{opacity:1;transform:none}
.t-main{font-size:clamp(2.5rem,13.5vw,7rem);font-weight:600;letter-spacing:.14em;text-indent:.14em;line-height:1;color:var(--white);
  text-shadow:0 2px 30px rgba(127,227,240,.12)}
.t-sub{font-size:clamp(1rem,4.8vw,2.1rem);font-weight:300;letter-spacing:.5em;text-indent:.5em;color:var(--cyan);margin-top:clamp(.7rem,2vh,1.2rem);
  text-shadow:0 0 22px rgba(127,227,240,.25)}
.tag{margin-top:clamp(1.2rem,4vh,2rem);font:300 clamp(.85rem,3vw,1.05rem)/1.5 var(--f-body);letter-spacing:.08em;color:var(--muted)}
.rule{width:min(5rem,22vw);height:1px;margin-top:clamp(1.2rem,4vh,2rem);background:linear-gradient(90deg,transparent,rgba(127,227,240,.55),transparent)}

/* Hand-off to first visualization */
.intro.done .title,.intro.done .sig{opacity:0;transition:opacity 1.1s ease}

@media (prefers-reduced-motion:reduce){
  .sig,.sig-line,.title>*,h1 span{transition:opacity .6s linear!important;transform:none!important}
}
</style>
</head>
<body>
<main class="intro" id="intro" aria-label="Mitosis: Prophase, opening title">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <p class="sig" id="sig"><span class="sig-name">Created by Sayan Mahjuba Suha</span><span class="sig-line" aria-hidden="true"></span></p>

  <header class="title" id="title">
    <p class="eyebrow" id="t1">The Cell Cycle • Phase 01</p>
    <h1><span class="t-main" id="t2">MITOSIS</span><span class="t-sub" id="t3">PROPHASE</span></h1>
    <span class="rule" id="t4" aria-hidden="true"></span>
    <p class="tag" id="t5">The Beginning of Cellular Division</p>
  </header>
</main>

<script>
(() => {
  'use strict';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const intro = $('intro');

  /* ---------- Timeline (seconds) ---------- */
  const k = reduce ? 0.6 : 1;
  const steps = [
    [0.4, () => $('sig').classList.add('in')],
    [3.6, () => { $('sig').classList.remove('in'); $('sig').classList.add('out'); }],
    [4.6, () => $('t1').classList.add('show')],
    [4.9, () => $('t2').classList.add('show')],
    [5.4, () => $('t3').classList.add('show')],
    [5.7, () => $('t4').classList.add('show')],
    [5.9, () => $('t5').classList.add('show')],
    [7.6, () => {
      // Hand off to the first cell visualization
      intro.classList.add('done');
      intro.dispatchEvent(new CustomEvent('intro:complete', { bubbles: true }));
      window.dispatchEvent(new CustomEvent('mitosis:intro-complete'));
    }]
  ];
  steps.forEach(([t, fn]) => setTimeout(fn, t * k * 1000));

  /* ---------- Scene ---------- */
  const cv = $('scene'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1, mx = 0, my = 0, sx = 0, sy = 0, last = 0;
  const t0 = performance.now();
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = v => 1 - Math.pow(1 - clamp(v), 3);

  // Deterministic pseudo-random so the cell is stable between frames
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const chromatin = Array.from({ length: 16 }, () => ({ a: rnd() * 6.28, d: rnd() * .7, len: .1 + rnd() * .12, rot: rnd() * 6.28, bend: (rnd() - .5) * 1.4 }));
  const mito = Array.from({ length: 7 }, (_, i) => ({ a: i / 7 * 6.28 + rnd() * .5, d: .62 + rnd() * .22, w: .07 + rnd() * .03, rot: rnd() * 3.14 }));
  let particles = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = W < 640 ? 34 : 64;
    particles = Array.from({ length: n }, () => ({
      x: rnd(), y: rnd(), z: .15 + rnd() * .85, r: .6 + rnd() * 1.8,
      vy: 4 + rnd() * 8, ph: rnd() * 6.28
    }));
    if (reduce) draw(t0 + 4500);
  }

  function glow(x, y, r, c) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(10,18,34,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function blob(cx, cy, rx, ry, tm, ph) {
    ctx.beginPath();
    for (let i = 0; i <= 72; i++) {
      const a = i / 72 * 6.2832;
      const w = 1 + .014 * Math.sin(3 * a + tm * .5 + ph) + .009 * Math.sin(5 * a - tm * .35 + ph);
      const x = cx + Math.cos(a) * rx * w, y = cy + Math.sin(a) * ry * w;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  function draw(now) {
    const dt = Math.min((now - last) / 1000 || .016, .05); last = now;
    const tm = (now - t0) / 1000;
    sx += (mx - sx) * .04; sy += (my - sy) * .04;
    const dx = reduce ? 0 : sx + Math.sin(tm * .13) * .5;
    const dy = reduce ? 0 : sy + Math.cos(tm * .11) * .4;
    const rv = ease((tm - .4) / 4.5);          // cell reveal
    const pv = ease((tm - .8) / 3);            // particle reveal

    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0A1222'; ctx.fillRect(0, 0, W, H);

    // Atmospheric gradients
    const big = Math.max(W, H);
    glow(W * .22 - dx * 18, H * .18 - dy * 12, big * .75, 'rgba(24,160,175,' + (.17 * rv) + ')');
    glow(W * .85 + dx * 14, H * .88 + dy * 10, big * .7, 'rgba(115,85,200,' + (.12 * rv) + ')');
    glow(W * .5, H * .5, big * .5, 'rgba(20,70,110,' + (.12 * rv) + ')');

    // Volumetric light shafts
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(W * .3 - dx * 16, -H * .15);
    ctx.rotate(.4 + Math.sin(tm * .1) * .02);
    [[0, .2, .03], [W * .3, .12, .022], [W * .52, .28, .018]].forEach(([o, w, a]) => {
      const ww = W * w, g = ctx.createLinearGradient(o, 0, o + ww, 0);
      g.addColorStop(0, 'rgba(60,200,210,0)');
      g.addColorStop(.5, 'rgba(60,200,210,' + (a * rv) + ')');
      g.addColorStop(1, 'rgba(60,200,210,0)');
      ctx.fillStyle = g; ctx.fillRect(o, 0, ww, H * 1.8);
    });
    ctx.restore();

    // Animal cell silhouette (slow push-in + 3 parallax layers)
    const zoom = 1 + .04 * Math.min(tm / 9, 1);
    const R = Math.min(W, H) * .44, rx = Math.min(W * .46, R * 1.15), ry = R;
    const cx = W / 2, cy = H / 2;
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);
    ctx.globalAlpha = rv;

    // far layer: membrane + cytoplasm
    ctx.save(); ctx.translate(-dx * 8, -dy * 6);
    let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rx);
    g.addColorStop(0, 'rgba(40,160,180,.07)'); g.addColorStop(.75, 'rgba(40,150,175,.08)'); g.addColorStop(1, 'rgba(90,210,225,.16)');
    blob(cx, cy, rx, ry, tm, 0); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(127,227,240,.28)'; ctx.stroke();
    blob(cx, cy, rx * .965, ry * .965, tm, 1.3); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(127,227,240,.1)'; ctx.stroke();
    ctx.restore();

    // mid layer: organelles + ER
    ctx.save(); ctx.translate(-dx * 16, -dy * 12);
    ctx.strokeStyle = 'rgba(120,200,230,.09)'; ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.ellipse(cx, cy, R * (.42 + i * .05), R * (.38 + i * .05), i * .5, .4 + i, 3.6 + i); ctx.stroke();
    }
    mito.forEach(m => {
      const x = cx + Math.cos(m.a) * rx * m.d, y = cy + Math.sin(m.a) * ry * m.d * .9;
      ctx.save(); ctx.translate(x, y); ctx.rotate(m.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, R * m.w * 1.7, R * m.w * .75, 0, 0, 6.2832);
      ctx.fillStyle = 'rgba(60,200,200,.05)'; ctx.fill();
      ctx.strokeStyle = 'rgba(110,225,225,.22)'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-R * m.w, 0);
      for (let j = -2; j <= 2; j++) ctx.quadraticCurveTo(j * R * m.w * .3, (j % 2 ? -1 : 1) * R * m.w * .4, j * R * m.w * .3 + R * m.w * .15, 0);
      ctx.strokeStyle = 'rgba(110,225,225,.12)'; ctx.stroke();
      ctx.restore();
    });
    ctx.restore();

    // near layer: nucleus with condensing chromatin, centrosomes
    ctx.save(); ctx.translate(-dx * 26, -dy * 20);
    const nr = R * .3;
    g = ctx.createRadialGradient(cx, cy, 0, cx, cy, nr);
    g.addColorStop(0, 'rgba(150,120,230,.15)'); g.addColorStop(1, 'rgba(50,130,180,.1)');
    ctx.beginPath(); ctx.arc(cx, cy, nr, 0, 6.2832); ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(175,155,240,.34)'; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, nr * 1.07, 0, 6.2832); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(175,155,240,.1)'; ctx.stroke();
    ctx.strokeStyle = 'rgba(205,190,255,.3)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
    chromatin.forEach(c => {
      const x = cx + Math.cos(c.a) * nr * c.d, y = cy + Math.sin(c.a) * nr * c.d, l = nr * c.len * 2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(c.rot);
      ctx.beginPath(); ctx.moveTo(-l, 0); ctx.quadraticCurveTo(0, l * c.bend, l, 0); ctx.stroke(); ctx.restore();
    });
    [[.5, -.62], [.56, -.5]].forEach(([ox, oy]) => {
      const x = cx + nr * ox * 1.6, y = cy + nr * oy * 1.9;
      ctx.beginPath(); ctx.arc(x, y, 2.2, 0, 6.2832); ctx.fillStyle = 'rgba(127,227,240,.4)'; ctx.fill();
      ctx.strokeStyle = 'rgba(127,227,240,.1)';
      for (let i = 0; i < 8; i++) { const a = i * .785; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * R * .12, y + Math.sin(a) * R * .12); ctx.stroke(); }
    });
    ctx.restore();
    ctx.restore();

    // Floating microscopic particles
    ctx.globalAlpha = 1;
    particles.forEach(p => {
      if (!reduce) { p.y -= p.vy * dt / H; if (p.y < -.02) { p.y = 1.02; p.x = rnd(); } }
      const x = p.x * W + Math.sin(tm * .3 + p.ph) * 10 * p.z - dx * 34 * p.z;
      const y = p.y * H - dy * 26 * p.z;
      const a = (.08 + .32 * p.z) * pv * (.7 + .3 * Math.sin(tm * .8 + p.ph));
      const r = p.r * (.6 + p.z);
      if (r > 1.8) {
        const gg = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
        gg.addColorStop(0, 'rgba(150,235,245,' + a + ')'); gg.addColorStop(1, 'rgba(150,235,245,0)');
        ctx.fillStyle = gg; ctx.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
      } else {
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
        ctx.fillStyle = (p.ph > 4.6 ? 'rgba(190,170,250,' : 'rgba(150,235,245,') + a + ')'; ctx.fill();
      }
    });

    if (!reduce) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  if (!reduce) {
    window.addEventListener('pointermove', e => {
      mx = (e.clientX / W - .5) * 2; my = (e.clientY / H - .5) * 2;
    }, { passive: true });
  }
  resize();
  if (!reduce) requestAnimationFrame(draw);
})();
</script>
</body>
</html>
